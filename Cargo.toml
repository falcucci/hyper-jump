[package]
name = "hyper-jump"
version = "0.10.1"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
authors = ["Alexsander Falcucci <alex.falcucci@gmail.com>"]
description = "A generalist all-in-one command-line version manager toolset for a more efficient development workflow."
categories = ["command-line-utilities"]
repository = "https://github.com/falcucci/hyper-jump"
keywords = ["blockchain", "cli-tool", "node-management", "version-manager"]

[[bin]]
name = "hj"
path = "src/main.rs"
proc-macro = false
required-features = []

[dependencies]
anyhow = "1.0.86"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5.4", features = ["derive", "env"] }
comfy-table = "7.1.1"
config = "0.15.19"
directories = "5.0.1"
flate2 = "1.0.30"
fs4 = "0.7.0"
futures-util = { version = "0.3.30", default-features = false }
indicatif = "0.17.8"
liblzma = "0.4.1"
miette = { version = "5.10.0", features = ["fancy"] }
nix = { version = "0.29.0", features = ["signal"] }
regex = "1.10.5"
reqwest = { version = "0.13.2", features = ["rustls", "stream"] }
semver = "1.0.23"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
signal-hook = "0.3.17"
tar = "0.4.45"
tokio = { version = "1.37.0", features = ["full"] }
tracing = "0.1.40"
tracing-indicatif = "0.3.5"
tracing-subscriber = "0.3.17"
yansi = "1.0.1"
zip = "8.3.0"

[profile.optimized]
inherits = "release"
opt-level = "z"
strip = true
lto = true
codegen-units = 1
